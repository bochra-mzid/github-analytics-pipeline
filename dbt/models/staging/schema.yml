version: 2

models:
  - name: stg_issues
    description: "Cleaned and standardized GitHub issues and pull requests."
    columns:
      - name: id
        description: "Unique GitHub issue or pull request ID."
        data_tests:
          - not_null
          - unique
      - name: author_id
        description: "ID of the contributor who created the issue or pull request."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contributors')
                field: id

      - name: state
        description: "Current state of the issue or pull request: open or closed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: number
        description: "Issue or pull request number within the repository."

      - name: title
        description: "Title of the issue or pull request."

      - name: created_at
        description: "Timestamp when the issue or pull request was created."

      - name: updated_at
        description: "Timestamp when the issue or pull request was last updated."
  - name: stg_contributors
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: login
        data_tests:
          - not_null
          - unique
  - name: stg_labels
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null
          - unique
  - name: stg_issue_labels
    columns:
      - name: issue_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_issues')
                field: id

      - name: label_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_labels')
                field: id
